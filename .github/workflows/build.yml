name: Build APK

# Workflow ini hanya membuktikan kode bisa dikompilasi dan diuji.
# Workflow rilis (tag v*, keystore, unggah ke GitHub Release) dibuat di Tahap 8.
on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Wrapper jar sengaja tidak disimpan di repo supaya repo bisa dibuat
      # dari HP, jadi Gradle datang dari action ini.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit test
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: DesktopBrowser-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
